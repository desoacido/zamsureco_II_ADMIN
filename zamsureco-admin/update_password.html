<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Password - ZAMCO II Admin</title>
  <!-- Tailwind CSS para mabilis at malinis ang itsura -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Set New Password</h2>
    <p id="introText" class="text-sm text-gray-600 mb-4 text-center">Verifying your reset link...</p>

    <div id="formWrap" class="hidden">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="••••••••" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
        <p class="text-xs text-gray-500 mt-1">Kahit man lang 8 characters ang haba.</p>
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2" for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
      </div>

      <button id="updateBtn" onclick="handleUpdatePassword()" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
        Update Password
      </button>
    </div>

    <p id="statusMessage" class="text-sm text-center mt-4"></p>

    <div class="text-center mt-6">
      <a href="admin_login.html" class="text-sm text-blue-600 hover:underline">Back to Login</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zrnvivattocqvxlxzsld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PUfegf_zyb5B_gVas_SLyw_mto9NFGF';
    // FIX: "sb" sa halip na "supabase" para consistent sa forgot_password.html
    // at para maiwasan ang parehong naming collision.
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const introText = document.getElementById('introText');
    const formWrap = document.getElementById('formWrap');
    const statusMessage = document.getElementById('statusMessage');
    const updateBtn = document.getElementById('updateBtn');

    function showStatus(text, color) {
      statusMessage.style.color = color;
      statusMessage.textContent = text;
    }

    // Kapag na-click ang link sa email, awtomatikong nagse-set ng recovery
    // session ang Supabase. Hinihintay natin ang PASSWORD_RECOVERY event
    // bago ipakita ang form, para sigurado tayong valid ang link.
    sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
        introText.classList.add('hidden');
        formWrap.classList.remove('hidden');
      }
    });

    // Fallback: kung hindi nag-fire ang event sa loob ng ilang segundo,
    // tsekin natin nang manu-mano kung may session ba.
    setTimeout(async () => {
      if (!formWrap.classList.contains('hidden')) return;

      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        introText.classList.add('hidden');
        formWrap.classList.remove('hidden');
      } else {
        introText.classList.add('hidden');
        showStatus('Hindi valid o expired na ang reset link. Humiling ulit ng bagong link sa Forgot Password page.', 'red');
      }
    }, 2500);

    async function handleUpdatePassword() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 8) {
        showStatus('Dapat kahit man lang 8 characters ang password.', 'red');
        return;
      }

      if (newPassword !== confirmPassword) {
        showStatus('Hindi magkatugma ang dalawang password. Pakisubukan ulit.', 'red');
        return;
      }

      updateBtn.disabled = true;
      updateBtn.textContent = 'Updating...';
      showStatus('', 'black');

      try {
        const { error } = await sb.auth.updateUser({ password: newPassword });
        if (error) throw error;

        formWrap.classList.add('hidden');
        showStatus('Matagumpay na na-update ang iyong password! Ire-redirect ka sa sign in page...', 'green');

        setTimeout(() => {
          window.location.href = 'admin_login.html';
        }, 2500);
      } catch (error) {
        updateBtn.disabled = false;
        updateBtn.textContent = 'Update Password';
        showStatus('Error: ' + error.message, 'red');
      }
    }
  </script>

</body>
</html>
