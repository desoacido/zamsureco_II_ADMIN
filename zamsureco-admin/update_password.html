<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAMSURECO II — Set New Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#081D45;
    --navy-800:#0D2E63;
    --navy-700:#153a7a;
    --amber:#F2A93B;
    --amber-deep:#C97C1B;
    --red:#DC3545;
    --red-bg:#FCE8EA;
    --green:#3F7857;
    --green-bg:#E7F3EC;
    --border:#E2E6ED;
    --text:#16233F;
    --text-faint:#9AA3B5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif; color:var(--text);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 20% 20%, #0f3a86 0%, var(--navy-900) 55%, #050f28 100%);
    position:relative; overflow:hidden; padding:16px;
  }
  body::before{
    content:""; position:absolute; inset:0;
    background-image:repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 38px);
    pointer-events:none;
  }
  .card{
    position:relative; z-index:1;
    background:#fff; width:380px; max-width:100%;
    border-radius:16px; padding:34px 32px 30px;
    box-shadow:0 24px 60px rgba(5,15,40,0.45);
  }
  .brand{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px;}
  .brand .brand-mark{width:44px; height:44px;}
  .brand .title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; color:var(--navy-900);}
  .brand .sub{font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--amber-deep); font-weight:700; margin-top:1px;}
  label{font-size:12px; font-weight:600; color:var(--navy-800); text-transform:uppercase; letter-spacing:0.5px; display:block; margin:14px 0 6px;}
  .hint{font-size:11.5px; color:var(--text-faint); margin-top:6px; line-height:1.4;}
  input{
    width:100%; padding:11px 42px 11px 13px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; font-family:'Inter',sans-serif; color:var(--text); background:#FBFCFE;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{outline:none; border-color:var(--navy-700); box-shadow:0 0 0 3px rgba(21,58,122,0.12); background:#fff;}
  .password-wrapper{position:relative; width:100%;}
  .toggle-password{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; padding:0;
    width:24px; height:24px; display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); transition:color .15s ease; margin:0; border-radius:0;
  }
  .toggle-password:hover{color:var(--navy-800);}
  .toggle-password:focus-visible{outline:2px solid var(--navy-700); outline-offset:2px; border-radius:4px;}
  .toggle-password svg{width:20px; height:20px; display:block;}
  .toggle-password .icon-eye-off{display:none;}
  .toggle-password.is-visible .icon-eye{display:none;}
  .toggle-password.is-visible .icon-eye-off{display:block;}
  button#updateBtn{
    width:100%; margin-top:20px; padding:12px; font-size:14px;
    background:var(--navy-800); color:#fff; border:none; border-radius:8px;
    cursor:pointer; font-weight:600; font-family:'Inter',sans-serif;
    transition:background .15s ease, transform .1s ease;
  }
  button#updateBtn:hover{background:var(--navy-700);}
  button#updateBtn:active{transform:scale(0.98);}
  button#updateBtn:disabled{opacity:0.6; cursor:default;}
  .msg{margin-top:14px; padding:10px 12px; border-radius:8px; font-size:12.5px; font-weight:500; display:none;}
  .msg.error{background:var(--red-bg); color:var(--red); border:1px solid #f5c2c7;}
  .msg.success{background:var(--green-bg); color:var(--green); border:1px solid #bfe0cc;}
  .back-link{display:block; text-align:center; margin-top:18px; font-size:12px; color:var(--navy-700); text-decoration:none;}
  .back-link:hover{text-decoration:underline;}
  .invalid{text-align:center; font-size:13px; color:var(--text-faint); line-height:1.5;}
</style>
</head>
<body>

  <div class="card">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="19" stroke="#F2A93B" stroke-width="1.4" opacity="0.5"/>
        <path d="M22 4 L10 22 H18 L16 36 L30 16 H21 L22 4Z" fill="#F2A93B"/>
      </svg>
      <div class="title">ZAMSURECO II</div>
      <div class="sub">Set New Password</div>
    </div>

    <form id="updateForm" style="display:none;">
      <label for="newPassword">New Password</label>
      <div class="password-wrapper">
        <input type="password" id="newPassword" placeholder="••••••••" required autocomplete="new-password">
        <button type="button" class="toggle-password" data-target="newPassword" aria-label="Show password" tabindex="0">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
      <p class="hint">At least 8 characters, with one uppercase letter and one number.</p>

      <label for="confirmPassword">Confirm New Password</label>
      <div class="password-wrapper">
        <input type="password" id="confirmPassword" placeholder="••••••••" required autocomplete="new-password">
        <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password" tabindex="0">
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>

      <button type="submit" id="updateBtn">Update Password</button>
    </form>

    <p id="invalidMsg" class="invalid" style="display:none;">
      This reset link is invalid or has expired. Please request a new one from the Forgot Password page.
    </p>

    <p id="updateMsg" class="msg error"></p>

    <a href="admin_login.html" class="back-link">&larr; Back to Sign In</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://zrnvivattocqvxlxzsld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PUfegf_zyb5B_gVas_SLyw_mto9NFGF';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('updateForm');
    const btn = document.getElementById('updateBtn');
    const msg = document.getElementById('updateMsg');
    const invalidMsg = document.getElementById('invalidMsg');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + type;
      msg.style.display = 'block';
    }

    // Eye toggles for both fields
    document.querySelectorAll('.toggle-password').forEach(function (t) {
      t.addEventListener('click', function () {
        const input = document.getElementById(t.dataset.target);
        const hidden = input.type === 'password';
        input.type = hidden ? 'text' : 'password';
        t.classList.toggle('is-visible', hidden);
        t.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
        input.focus();
      });
    });

    // The reset link opens this page with a recovery session. Only show the form if there is one.
    sb.auth.onAuthStateChange(function (event, session) {
      if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
        form.style.display = 'block';
        invalidMsg.style.display = 'none';
      }
    });

    setTimeout(async function () {
      const { data } = await sb.auth.getSession();
      if (!data.session) {
        invalidMsg.style.display = 'block';
      }
    }, 1500);

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 8) {
        return showMsg('Password must be at least 8 characters long.', 'error');
      }
      if (!/[A-Z]/.test(newPassword)) {
        return showMsg('Password must have at least one uppercase letter.', 'error');
      }
      if (!/[0-9]/.test(newPassword)) {
        return showMsg('Password must have at least one number.', 'error');
      }
      if (newPassword !== confirmPassword) {
        return showMsg('Passwords do not match.', 'error');
      }

      btn.disabled = true;
      btn.textContent = 'Updating...';
      msg.style.display = 'none';

      const { error } = await sb.auth.updateUser({ password: newPassword });

      if (error) {
        btn.disabled = false;
        btn.textContent = 'Update Password';
        return showMsg(error.message, 'error');
      }

      // Sign out so the admin logs in again with the new password
      await sb.auth.signOut();
      form.style.display = 'none';
      showMsg('Password updated! Redirecting to sign in...', 'success');
      setTimeout(function () {
        window.location.href = 'admin_login.html';
      }, 1500);
    });
  </script>
</body>
</html>
