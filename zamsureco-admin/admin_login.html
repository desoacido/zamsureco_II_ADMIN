<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAMSURECO II — Admin Sign In</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#081D45;
    --navy-800:#0D2E63;
    --navy-700:#153a7a;
    --amber:#F2A93B;
    --amber-deep:#C97C1B;
    --red:#DC3545;
    --red-bg:#FCE8EA;
    --green:#3F7857;
    --green-bg:#E7F3EC;
    --border:#E2E6ED;
    --text:#16233F;
    --text-faint:#9AA3B5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif; color:var(--text);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 20% 20%, #0f3a86 0%, var(--navy-900) 55%, #050f28 100%);
    position:relative; overflow:hidden;
  }
  body::before{
    content:""; position:absolute; inset:0;
    background-image:repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 38px);
    pointer-events:none;
  }
  .login-card{
    position:relative; z-index:1;
    background:#fff; width:380px; max-width:90vw;
    border-radius:16px; padding:34px 32px 30px;
    box-shadow:0 24px 60px rgba(5,15,40,0.45);
  }
  .login-brand{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px;}
  .login-brand .brand-mark{width:44px; height:44px;}
  .login-brand .login-title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; color:var(--navy-900);}
  .login-brand .login-sub{font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--amber-deep); font-weight:700; margin-top:1px;}
  label{font-size:12px; font-weight:600; color:var(--navy-800); text-transform:uppercase; letter-spacing:0.5px; display:block; margin:14px 0 6px;}
  input{
    width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; font-family:'Inter',sans-serif; color:var(--text); background:#FBFCFE;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{outline:none; border-color:var(--navy-700); box-shadow:0 0 0 3px rgba(21,58,122,0.12); background:#fff;}

  /* ===== PASSWORD FIELD WITH TOGGLE ===== */
  .password-wrapper{position:relative; width:100%;}
  .password-wrapper input{padding-right:42px;}
  .toggle-password{
    position:absolute; right:10px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; padding:0;
    width:24px; height:24px; display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); transition:color .15s ease; margin:0; border-radius:0; font-size:0;
  }
  .toggle-password:hover{color:var(--navy-800);}
  .toggle-password:focus-visible{outline:2px solid var(--navy-700); outline-offset:2px; border-radius:4px;}
  .toggle-password svg{width:20px; height:20px; display:block;}
  .toggle-password .icon-eye-off{display:none;}
  .toggle-password.is-visible .icon-eye{display:none;}
  .toggle-password.is-visible .icon-eye-off{display:block;}

  .forgot-password-container{text-align:right; margin-top:8px; margin-bottom:4px;}
  .forgot-password-container button{
    background:none; border:none; cursor:pointer; padding:0;
    font-size:12px; color:var(--navy-700); font-family:'Inter',sans-serif;
  }
  .forgot-password-container button:hover{text-decoration:underline;}
  .forgot-password-container button:disabled{opacity:0.6; cursor:default;}

  button[type="submit"]{
    width:100%; margin-top:18px; padding:12px; font-size:14px;
    background:var(--navy-800); color:#fff; border:none; border-radius:8px;
    cursor:pointer; font-weight:600; font-family:'Inter',sans-serif;
    transition:background .15s ease, transform .1s ease;
  }
  button[type="submit"]:hover{background:var(--navy-700);}
  button[type="submit"]:active{transform:scale(0.98);}
  button[type="submit"]:disabled{opacity:0.6; cursor:default;}

  .login-msg{
    margin-top:14px; padding:10px 12px; border-radius:8px; font-size:12.5px; font-weight:500; display:none;
  }
  .login-msg.error{background:var(--red-bg); color:var(--red); border:1px solid #f5c2c7;}
  .login-msg.success{background:var(--green-bg); color:var(--green); border:1px solid #bfe0cc;}

  .login-footnote{text-align:center; font-size:11.5px; color:var(--text-faint); margin-top:20px; line-height:1.5;}
  .back-link{display:block; text-align:center; margin-top:15px; font-size:12px; color:var(--navy-700); text-decoration:none;}
  .back-link:hover{text-decoration:underline;}
</style>
</head>
<body>

  <div class="login-card">
    <div class="login-brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="19" stroke="#F2A93B" stroke-width="1.4" opacity="0.5"/>
        <path d="M22 4 L10 22 H18 L16 36 L30 16 H21 L22 4Z" fill="#F2A93B"/>
      </svg>
      <div class="login-title">ZAMSURECO II</div>
      <div class="login-sub">Admin Sign In</div>
    </div>

    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="admin@zamsureco2.com" required autocomplete="username">

      <label for="loginPassword">Password</label>
      <div class="password-wrapper">
        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password" aria-pressed="false" tabindex="0">
          <!-- Eye (hidden) icon -->
          <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <!-- Eye-off (visible) icon -->
          <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>

      <div class="forgot-password-container">
        <a href="forgot_password.html">Forgot Password?</a>
      </div>

      <button type="submit" id="loginBtn">Sign In</button>
    </form>

    <p id="loginMsg" class="login-msg error"></p>
    <p class="login-footnote">System for managing reports and announcements.</p>
    <a href="index.html" class="back-link">&larr; Back to Home</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://zrnvivattocqvxlxzsld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PUfegf_zyb5B_gVas_SLyw_mto9NFGF';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const HOME_PAGE = 'admin_dashboard.html';

    const loginForm = document.getElementById('loginForm');
    const loginMsg = document.getElementById('loginMsg');
    const loginBtn = document.getElementById('loginBtn');

    function showMsg(text, type) {
      loginMsg.textContent = text;
      loginMsg.className = 'login-msg ' + type;
      loginMsg.style.display = 'block';
    }

    // ===== PASSWORD TOGGLE LOGIC =====
    const passwordInput = document.getElementById('loginPassword');
    const toggleBtn = document.getElementById('togglePassword');

    toggleBtn.addEventListener('click', function () {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleBtn.classList.toggle('is-visible', isPassword);
      toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
      toggleBtn.setAttribute('aria-pressed', isPassword ? 'true' : 'false');
      passwordInput.focus();
    });

    // Auto-redirect only if already logged in AND listed in admins
    (async () => {
      const { data: { session } } = await _supabase.auth.getSession();
      if (session && await isAdmin(session.user.id)) {
        window.location.href = HOME_PAGE;
      }
    })();

    // Checks the admins table. Only users listed there can enter the admin site.
    async function isAdmin(userId) {
      const { data, error } = await _supabase
        .from('admins')
        .select('user_id')
        .eq('user_id', userId)
        .maybeSingle();
      return !error && !!data;
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginMsg.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

      if (error) {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
        const msg = error.message.toLowerCase();
        if (msg.includes('email not confirmed')) {
          showMsg('Please confirm your email first. Check your inbox for the confirmation link.', 'error');
        } else if (msg.includes('invalid login')) {
          showMsg('Invalid email or password. Please try again.', 'error');
        } else {
          showMsg(error.message, 'error');
        }
        return;
      }

      // Walang access kung wala sa admins table
      if (!(await isAdmin(data.user.id))) {
        await _supabase.auth.signOut();
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
        showMsg('This account is not authorized for admin access.', 'error');
        return;
      }

      window.location.href = HOME_PAGE;
    });

  </script>
</body>
</html>
