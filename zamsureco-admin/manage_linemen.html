<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAMSURECO II — Field Personnel</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:    { 900:'#12203A', 800:'#1B2E4F', 700:'#2A4166' },
          paper:  { 50:'#F5F3EE', 100:'#EFEDE6' },
          line:   '#DBD8CF',
          copper: { 500:'#B9722E', 100:'#F3E4D2' },
          ok:     { 600:'#3F7857', 100:'#E1EBE3' },
          danger: { 600:'#A33B34', 100:'#F2E1DF' },
          info:   { 600:'#2F5D8A', 100:'#DEE7EF' },
          brand:  { 50:'#EEF1FB', 100:'#DDE3F7', 200:'#C5CCDA', 700:'#1A2B9E', 800:'#0D2E63', 900:'#0B1555' },
          navy:   { 900:'#0B1555' },
          gold:   { 100:'#FCEACB', 500:'#C28A1A', 700:'#8A5A12' },
        },
        fontFamily: {
          sans: ['"IBM Plex Sans"','system-ui','sans-serif'],
          mono: ['"IBM Plex Mono"','ui-monospace','monospace'],
        },
        borderRadius: { DEFAULT: '3px' }
      }
    }
  }
</script>
<style>
  /* ===== Page-level ===== */
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  
  /* ===== Header hamburger ===== */
  .hamburger-btn {
    width: 40px; height: 40px; border-radius: 10px;
    background: #fff; border: 1px solid #DBD8CF;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    cursor: pointer; flex-shrink: 0; transition: background .12s;
  }
  .hamburger-btn:hover { background: #F5F3EE; }
  .hamburger-btn .bar { display: block; width: 16px; height: 2px; background: #2A4166; border-radius: 999px; }

  /* ===== Buttons ===== */
  .btn-primary, .btn-ok, .btn-danger, .btn-ghost {
    display: inline-flex; align-items: center; gap: 6px; justify-content: center;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    border: 1px solid transparent; transition: transform .12s, box-shadow .12s, filter .12s;
    cursor: pointer; white-space: nowrap;
  }
  .btn-primary { background: #0D2E63; color: #fff; box-shadow: 0 2px 8px rgba(13,46,99,.18); }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(13,46,99,.22); }
  .btn-primary:disabled { background: #9AA3B2; cursor: not-allowed; box-shadow: none; }

  .btn-ok { background: #3F7857; color: #fff; box-shadow: 0 2px 8px rgba(63,120,87,.18); }
  .btn-ok:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }

  .btn-danger { background: #A33B34; color: #fff; box-shadow: 0 2px 8px rgba(163,59,52,.18); }
  .btn-danger:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px); }

  .btn-ghost { background: #fff; color: #0D2E63; border: 1px solid #DBD8CF; box-shadow: 0 1px 3px rgba(11,21,85,.06); }
  .btn-ghost:hover:not(:disabled) { background: #F7F8FA; transform: translateY(-1px); box-shadow: 0 2px 6px rgba(11,21,85,.1); }

  .icon-btn {
    width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 8px; color: #4A5372; transition: all .12s;
  }
  .icon-btn:hover { background: #EEF1FB; color: #0D2E63; transform: translateY(-1px); }
  .icon-btn.danger:hover { background: #F2E1DF; color: #A33B34; }
  .icon-btn svg { width: 17px; height: 17px; }

  /* ===== Form Fields ===== */
  .field {
    width: 100%; padding: 8px 10px; background: #F5F3EE; border: 1px solid #DBD8CF;
    border-radius: 6px; font-size: 13px; transition: box-shadow .12s, border-color .12s;
  }
  .field:focus { outline: none; border-color: #0D2E63; box-shadow: 0 0 0 2px rgba(13,46,99,0.18); background: #fff; }
  .field:disabled { opacity: .55; cursor: not-allowed; }

  /* ===== KPI Cards ===== */
  .kpi-card {
    position: relative; display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1px solid #DDE3EC; border-left: 3px solid var(--accent, #0D2E63);
    border-radius: 10px; box-shadow: 0 2px 6px rgba(11,21,85,.05);
    padding: 14px 16px; min-height: 72px; cursor: pointer; text-align: left; width: 100%;
    transition: border-color .15s, box-shadow .15s, transform .15s, background .15s;
    overflow: hidden;
  }
  .kpi-card:hover { background: #FCFCFD; box-shadow: 0 6px 18px rgba(11,21,85,.10); transform: translateY(-2px); }
  .kpi-card::after {
    content: "›"; position: absolute; right: 12px; top: 50%;
    transform: translateY(-50%) translateX(4px);
    font-size: 20px; font-weight: 700; color: var(--accent, #0D2E63);
    opacity: 0; transition: opacity .15s, transform .15s; pointer-events: none;
  }
  .kpi-card:hover::after { opacity: 1; transform: translateY(-50%) translateX(0); }
  .kpi-card[aria-pressed="true"] { box-shadow: inset 0 -3px 0 #C28A1A, 0 2px 6px rgba(11,21,85,.05); }

  .kpi-card .kpi-icon {
    width: 38px; height: 38px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .kpi-card .kpi-icon svg { width: 20px; height: 20px; }
  .kpi-card .kpi-label {
    font-size: 10px; line-height: 1.2; font-weight: 600; letter-spacing: .02em;
    text-transform: uppercase; color: #6B7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kpi-card .kpi-value {
    font-size: 22px; line-height: 1.1; font-weight: 700; color: #0B1555;
    font-variant-numeric: tabular-nums; margin-top: 2px;
    display: flex; align-items: baseline; gap: 6px;
  }
  .kpi-card .kpi-sub { font-size: 11px; font-weight: 500; color: #6B7280; font-variant-numeric: tabular-nums; }

  /* ===== Table & Scroll Box ===== */
  .scroll-box { overflow-y: auto; scrollbar-width: thin; scrollbar-color: #C5CCDA #F3F5FD; }
  .scroll-box::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-box::-webkit-scrollbar-track { background: #F3F5FD; border-radius: 4px; }
  .scroll-box::-webkit-scrollbar-thumb { background: #C5CCDA; border-radius: 4px; border: 2px solid #F3F5FD; }
  .scroll-box::-webkit-scrollbar-thumb:hover { background: #A9B3C6; }
  
  #tableWrapper.scroll-box { max-height: none; min-height: 280px; }
  @media (max-height: 640px) { #tableWrapper.scroll-box { min-height: 200px; } }

  .app-table thead th {
    position: sticky; top: 0; z-index: 1;
    background: #F7F8FA; color: #4A5372;
    font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    padding: 10px 16px; border-bottom: 1px solid #DDE3EC;
    white-space: nowrap;
  }
  .app-table tbody tr { transition: background .12s; }
  .app-table tbody tr:hover { background: #F8FAFF; }

  /* Fix table stretching in flex containers */
  #personnelRows { vertical-align: top; }
  #personnelRows tr { height: 1px; }
  #personnelRows td { vertical-align: middle; }

  /* ===== Toast & Modals ===== */
  .toast-in { animation: toastIn .2s ease; }
  @keyframes toastIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
</style>
</head>
<body class="bg-paper-50 text-ink-900 font-sans overflow-x-hidden">

  <div id="sidebar-root"></div>

  <div class="main-content !p-0 flex-1 flex flex-col h-screen overflow-hidden">

    <!-- ===== Navbar ===== -->
    <nav class="bg-white border-b border-line px-6 h-16 flex justify-between items-center flex-shrink-0">
      <div class="flex items-center gap-4">
        <button class="hamburger-btn" id="sidebarToggle" aria-label="Toggle navigation menu">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
        <div>

        Add personnel

    <!-- ===== Main (flex fill layout) ===== -->
    <main class="flex-1 min-h-0 p-4 lg:p-6 flex flex-col">
      <div class="flex-1 min-h-0 flex flex-col gap-4 lg:gap-5">

        <div id="diagBanner" class="hidden bg-danger-100 border border-danger-600/30 text-danger-600 text-sm rounded-lg p-4 flex-shrink-0"></div>

        <!-- KPI Cards -->
        <div id="roleCards" class="grid grid-cols-1 sm:grid-cols-3 gap-3 flex-shrink-0">
          <button class="kpi-card" data-filter="Engineer" style="--accent:#0D2E63;" aria-pressed="false">
            <span class="kpi-icon bg-brand-50 text-brand-700">
              <!-- Hard hat / Engineer icon -->
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v2z"/><path d="M10 10V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v5"/><path d="M4 15v-3a6 6 0 0 1 6-6h0"/><path d="M14 6h0a6 6 0 0 1 6 6v3"/></svg>

        <!-- Table Card (fills remaining space) -->
        <section class="bg-white border border-line rounded-lg overflow-hidden flex-1 flex flex-col min-h-0">
          <header class="px-5 py-4 border-b border-line flex items-end justify-between gap-4 flex-wrap flex-shrink-0">

              <h2 id="listTitle" class="text-sm font-semibold text-ink-900 section-head">All active personnel</h2>

  <!-- ===== Add / Edit Modal ===== -->

  <!-- ===== Confirm Delete Modal ===== -->
  <div id="confirmModal" class="hidden fixed inset-0 z-[550] items-center justify-center p-4" style="background:rgba(11,21,85,0.45)">
    <div class="bg-white rounded-lg border border-line shadow-2xl w-full max-w-sm">
      <div class="px-6 pt-6 pb-4">
        <div class="flex items-start gap-3">
          <div class="w-10 h-10 rounded-full bg-danger-100 flex items-center justify-center flex-shrink-0 text-danger-600">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          </div>
          <div class="flex-1">
            <h3 class="text-base font-semibold text-ink-900">Remove from the list?</h3>

      </div>

  </div>

  <!-- ===== Toast ===== -->
  <div id="toast" class="hidden fixed bottom-6 right-6 max-w-sm px-4 py-3 rounded-lg text-sm font-semibold shadow-lg z-[600]"></div>

  <script>
    const SUPABASE_URL = 'https://zrnvivattocqvxlxzsld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PUfegf_zyb5B_gVas_SLyw_mto9NFGF';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ICONS = {
      // Standard Pencil / Edit
      edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
      // User-X (Deactivate / Set Inactive)
      pause: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" y1="8" x2="22" y2="13"/><line x1="22" y1="8" x2="17" y2="13"/></svg>',
      // User-Check (Activate / Set Active)
      play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg>',
      // Standard Trash / Delete
      trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>',
    };
    const ROLE_STYLE = {
      'Engineer': 'bg-brand-100 text-brand-800',
      'Line Crew': 'bg-gold-100 text-gold-700',
    };
    const TITLES = {
      all: 'All active personnel',
      'Engineer': 'Engineers',
      'Line Crew': 'Line crew',
      inactive: 'Inactive personnel',
    };

    let people = [];
    let filter = 'all';
    let editingId = null;
    let pendingDelete = null;

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function toast(msg, ok = true) {
      const t = document.getElementById('toast');
      t.className = 'toast-in fixed bottom-6 right-6 max-w-sm px-4 py-3 rounded-lg text-sm font-semibold shadow-lg z-[600] ' +
        (ok ? 'bg-ok-100 text-ok-600 border border-ok-600/30' : 'bg-danger-100 text-danger-600 border border-danger-600/30');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.add('hidden'), 4500);
    }

    function showBanner(msg) {
      const b = document.getElementById('diagBanner');
      b.textContent = msg;
      b.classList.remove('hidden');
    }

    function openModal(id) { const m = document.getElementById(id); m.classList.remove('hidden'); m.classList.add('flex'); }
    function closeModal(id) { const m = document.getElementById(id); m.classList.add('hidden'); m.classList.remove('flex'); }

    const roleOf = (p) => p.role === 'Engineer' ? 'Engineer' : 'Line Crew';
    const isActive = (p) => (p.status || 'active') === 'active';

    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) { window.location.href = 'admin_login.html'; return; }
      loadPeople();
    }

    async function loadPeople() {
      const { data, error } = await supabaseClient.from('linemen').select('*').order('name', { ascending: true });
      if (error) {
        showBanner('Could not load personnel: ' + error.message);
        document.getElementById('personnelRows').innerHTML = `<tr><td colspan="6" class="px-5 py-10 text-center text-danger-600">${escapeHtml(error.message)}</td></tr>`;
        return;
      }
      people = data || [];
      if (people.length && !('role' in people[0])) {
        showBanner('The "role" column is missing. Please run field_personnel.sql in Supabase, then refresh this page.');
      }
      render();
    }

    function inFilter(p) {
      if (filter === 'inactive') return !isActive(p);
      if (!isActive(p)) return false;
      return filter === 'all' || roleOf(p) === filter;
    }

    function render() {
      document.getElementById('countEngineer').textContent = people.filter(p => isActive(p) && roleOf(p) === 'Engineer').length;
      document.getElementById('countCrew').textContent = people.filter(p => isActive(p) && roleOf(p) === 'Line Crew').length;
      document.getElementById('countInactive').textContent = people.filter(p => !isActive(p)).length;

      document.querySelectorAll('#roleCards .kpi-card').forEach(c => {
        c.setAttribute('aria-pressed', c.dataset.filter === filter ? 'true' : 'false');
      });
      
      document.getElementById('listTitle').textContent = TITLES[filter];
      document.getElementById('listHint').textContent = filter === 'all' ? 'Click a card above to filter.' : 'Click the card again to show all active personnel.';

      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const list = people.filter(inFilter).filter(p => !q || [p.name, p.team, p.contact_number, roleOf(p)].join(' ').toLowerCase().includes(q));
      const tbody = document.getElementById('personnelRows');

      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="6" class="px-5 py-16 text-center text-ink-700">${people.length ? 'No personnel here.' : 'No personnel yet. Click "+ Add personnel" to add an engineer or line crew member.'}</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(p => `
        <tr class="${isActive(p) ? '' : 'opacity-60'}">
          <td class="px-5 py-3 font-semibold text-ink-900">${escapeHtml(p.name)}</td>
          <td class="px-4 py-3"><span class="px-2.5 py-0.5 rounded-full text-xs font-medium border ${ROLE_STYLE[roleOf(p)]} border-transparent">${roleOf(p)}</span></td>
          <td class="px-4 py-3 text-ink-700">${roleOf(p) === 'Line Crew' ? escapeHtml(p.team || '—') : '<span class="text-ink-700/50">—</span>'}</td>
          <td class="px-4 py-3 text-ink-700 num">${escapeHtml(p.contact_number || '—')}</td>
          <td class="px-4 py-3">${isActive(p)
            ? '<span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-ok-100 text-ok-600">Active</span>'
            : '<span class="px-2.5 py-0.5 rounded-full text-xs font-medium bg-paper-100 text-ink-700">Inactive</span>'}</td>
          <td class="px-5 py-3 text-right whitespace-nowrap">
            <button class="icon-btn" data-act="edit" data-id="${p.id}" title="Edit personnel">${ICONS.edit}</button>
            <button class="icon-btn" data-act="toggle" data-id="${p.id}" title="${isActive(p) ? 'Deactivate' : 'Activate'}">${isActive(p) ? ICONS.pause : ICONS.play}</button>
            <button class="icon-btn danger" data-act="delete" data-id="${p.id}" title="Remove permanently">${ICONS.trash}</button>
          </td>
        </tr>`).join('');
    }

    function syncTeamField() {
      const crew = document.getElementById('fRole').value === 'Line Crew';
      document.getElementById('teamWrap').classList.toggle('hidden', !crew);
      document.getElementById('fName').placeholder = crew ? 'e.g. Juan Dela Cruz' : 'e.g. Engr. Juan Dela Cruz';
    }

    function openForm(p) {
      editingId = p ? p.id : null;
      document.getElementById('formTitle').textContent = p ? 'Edit personnel' : 'Add personnel';
      document.getElementById('fRole').value = p ? roleOf(p) : (filter === 'Engineer' ? 'Engineer' : 'Line Crew');
      document.getElementById('fName').value = p ? (p.name || '') : '';
      document.getElementById('fTeam').value = p ? (p.team || '') : '';
      document.getElementById('fContact').value = p ? (p.contact_number || '') : '';
      document.getElementById('fActive').checked = p ? isActive(p) : true;
      document.getElementById('formError').classList.add('hidden');
      const teams = [...new Set(people.map(x => (x.team || '').trim()).filter(Boolean))].sort();
      document.getElementById('teamList').innerHTML = teams.map(t => `<option value="${escapeHtml(t)}"></option>`).join('');
      syncTeamField();
      openModal('formModal');
      document.getElementById('fName').focus();
    }

    function formError(msg) {
      const e = document.getElementById('formError');
      e.textContent = msg;
      e.classList.remove('hidden');
    }

    async function saveForm() {
      const role = document.getElementById('fRole').value;
      const name = document.getElementById('fName').value.trim();
      const team = role === 'Line Crew' ? document.getElementById('fTeam').value.trim() : '';
      const contact = document.getElementById('fContact').value.trim();
      const status = document.getElementById('fActive').checked ? 'active' : 'inactive';

      if (!name) { formError('Enter the full name.'); return; }
      if (role === 'Line Crew' && !team) { formError('Enter the team this lineman belongs to.'); return; }
      if (contact && !/^09\d{9}$/.test(contact)) { formError('Contact number must be 11 digits starting with 09.'); return; }

      const values = { name, role, team: team || null, contact_number: contact || null, status };
      const btn = document.getElementById('formSave');
      btn.disabled = true;
      const { error } = editingId
        ? await supabaseClient.from('linemen').update(values).eq('id', editingId)
        : await supabaseClient.from('linemen').insert([values]);
      btn.disabled = false;

      if (error) {
        formError(/role/.test(error.message) ? 'The "role" column is missing. Please run field_personnel.sql in Supabase first.' : error.message);
        return;
      }
      closeModal('formModal');
      toast(editingId ? `${name} updated.` : `${name} added as ${role === 'Engineer' ? 'an engineer' : 'line crew'}.`);
      loadPeople();
    }

    async function toggleStatus(p) {
      const status = isActive(p) ? 'inactive' : 'active';
      const { error } = await supabaseClient.from('linemen').update({ status }).eq('id', p.id);
      if (error) { toast(error.message, false); return; }
      toast(`${p.name} is now ${status}.`);
      loadPeople();
    }

    async function confirmDelete() {
      if (!pendingDelete) return;
      const p = pendingDelete;
      closeModal('confirmModal');
      pendingDelete = null;
      const { error } = await supabaseClient.from('linemen').delete().eq('id', p.id);
      if (error) { toast(error.message, false); return; }
      toast(`${p.name} removed.`);
      loadPeople();
    }

    document.getElementById('personnelRows').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const p = people.find(x => String(x.id) === btn.dataset.id);
      if (!p) return;
      if (btn.dataset.act === 'edit') openForm(p);
      if (btn.dataset.act === 'toggle') toggleStatus(p);
      if (btn.dataset.act === 'delete') {
        pendingDelete = p;
        document.getElementById('confirmText').textContent =
          `${p.name} will be removed from the list. Past records that mention this name will stay as they are. To hide them from dropdowns only, set them as inactive instead.`;
        openModal('confirmModal');
      }
    });

    document.querySelectorAll('#roleCards .kpi-card').forEach(card => card.addEventListener('click', () => {
      filter = filter === card.dataset.filter ? 'all' : card.dataset.filter;
      render();
    }));

    document.getElementById('addBtn').addEventListener('click', () => openForm(null));
    document.getElementById('fRole').addEventListener('change', syncTeamField);
    document.getElementById('formCancel').addEventListener('click', () => closeModal('formModal'));
    document.getElementById('formSave').addEventListener('click', saveForm);
    document.getElementById('formModal').addEventListener('click', (e) => { if (e.target.id === 'formModal') closeModal('formModal'); });
    document.getElementById('confirmNo').addEventListener('click', () => { closeModal('confirmModal'); pendingDelete = null; });
    document.getElementById('confirmYes').addEventListener('click', confirmDelete);
    document.getElementById('confirmModal').addEventListener('click', (e) => { if (e.target.id === 'confirmModal') { closeModal('confirmModal'); pendingDelete = null; } });
    document.getElementById('searchInput').addEventListener('input', render);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal('formModal'); closeModal('confirmModal'); } });
    document.addEventListener('click', async (e) => {
      if (e.target.closest('#logoutBtn')) {
        await supabaseClient.auth.signOut();
        window.location.href = 'admin_login.html';
      }
    });

    checkAuth();
  </script>
  <script src="sidebar.js"></script>
</body>
</html>
