<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAMSURECO II — Manage Linemen</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:    { 900:'#12203A', 800:'#1B2E4F', 700:'#2A4166' },
          paper:  { 50:'#F5F3EE', 100:'#EFEDE6' },
          line:   '#DBD8CF',
          copper: { 500:'#B9722E', 100:'#F3E4D2' },
          ok:     { 600:'#3F7857', 100:'#E1EBE3' },
          danger: { 600:'#A33B34', 100:'#F2E1DF' },
          info:   { 600:'#2F5D8A', 100:'#DEE7EF' },
        },
        fontFamily: {
          sans: ['"IBM Plex Sans"','system-ui','sans-serif'],
          mono: ['"IBM Plex Mono"','ui-monospace','monospace'],
        },
        borderRadius: { DEFAULT: '3px' }
      }
    }
  }
</script>
<style>
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
</style>
</head>
<body class="bg-paper-50 text-ink-900 font-sans overflow-x-hidden">

  <div id="sidebar-root"></div>

  <div class="main-content !p-0 flex-1 flex flex-col h-screen overflow-hidden">

    <nav class="bg-paper-50 border-b border-line px-6 h-16 flex justify-between items-center flex-shrink-0">
      <div class="flex items-center gap-4">
        <button class="hamburger-btn bg-white hover:bg-paper-100 border border-line rounded w-9 h-9 flex flex-col items-center justify-center gap-1 cursor-pointer transition flex-shrink-0" id="sidebarToggle" aria-label="Toggle navigation menu">
          <span class="block w-4 h-0.5 bg-ink-700"></span>
          <span class="block w-4 h-0.5 bg-ink-700"></span>
          <span class="block w-4 h-0.5 bg-ink-700"></span>
        </button>
        <h1 class="text-lg font-semibold text-ink-900 leading-tight">Manage Linemen</h1>
      </div>
      <div class="hidden sm:flex items-center gap-4 text-sm text-ink-700">
        <span id="adminEmail" class="font-medium"></span>
        <span class="h-4 w-px bg-line"></span>
        <span id="clockText" class="num text-[13px]">—</span>
      </div>
    </nav>

    <main class="flex-1 overflow-y-auto p-6 lg:p-8">
      <div class="max-w-4xl mx-auto space-y-8">

        <!-- Add lineman form -->
        <section class="bg-white border border-line rounded">
          <header class="px-5 py-3 border-b border-line">
            <h2 class="text-sm font-semibold text-ink-900">Add new lineman</h2>
            <p class="text-xs text-ink-700/70 mt-0.5">This roster feeds the "Assigned Crew/Lineman" dropdown in Incident Review.</p>
          </header>
          <div class="p-5">
            <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 items-end">
              <div>
                <label class="block text-xs font-medium text-ink-700 mb-1">Name</label>
                <input id="fName" type="text" placeholder="Juan Dela Cruz"
                  class="w-full border border-line rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-ink-700">
              </div>
              <div>
                <label class="block text-xs font-medium text-ink-700 mb-1">Contact number</label>
                <input id="fContact" type="text" placeholder="09171234567"
                  class="w-full border border-line rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-ink-700">
              </div>
              <div>
                <label class="block text-xs font-medium text-ink-700 mb-1">Team</label>
                <input id="fTeam" type="text" placeholder="Line Crew Alpha (Team 3)"
                  class="w-full border border-line rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-ink-700">
              </div>
              <button onclick="addLineman()"
                class="bg-ink-900 hover:bg-ink-800 text-white font-medium px-4 py-2 rounded transition text-sm">
                + Add lineman
              </button>
            </div>
            <div id="formStatus" class="text-xs mt-2"></div>
          </div>
        </section>

        <!-- Roster table -->
        <section class="bg-white border border-line rounded">
          <header class="px-5 py-3 border-b border-line flex justify-between items-baseline">
            <h2 class="text-sm font-semibold text-ink-900">Linemen roster</h2>
            <span class="text-xs text-ink-700/70">Toggle status to control who appears as "active" in dispatch</span>
          </header>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="text-left text-ink-700 bg-paper-100">
                  <th class="px-5 py-2 font-medium">Name</th>
                  <th class="px-3 py-2 font-medium">Contact</th>
                  <th class="px-3 py-2 font-medium">Team</th>
                  <th class="px-3 py-2 font-medium">Status</th>
                  <th class="px-5 py-2 font-medium">Actions</th>
                </tr>
              </thead>
              <tbody id="linemenBody" class="divide-y divide-line">
                <tr><td colspan="5" class="px-5 py-6 text-center text-ink-700/60">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </section>

      </div>
    </main>
  </div>

  <script src="sidebar.js"></script>
  <script>
    const SUPABASE_URL = 'https://zrnvivattocqvxlxzsld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PUfegf_zyb5B_gVas_SLyw_mto9NFGF';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function tickClock() {
      const el = document.getElementById('clockText');
      if (el) el.textContent = new Date().toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' });
    }
    tickClock();
    setInterval(tickClock, 30000);

    (async () => {
      try {
        const { data } = await _supabase.auth.getSession();
        const email = data?.session?.user?.email;
        if (email) document.getElementById('adminEmail').textContent = email;
      } catch (e) { /* optional */ }
    })();

    function showStatus(msg, isError = false) {
      const el = document.getElementById('formStatus');
      el.textContent = msg;
      el.className = 'text-xs mt-2 ' + (isError ? 'text-danger-600' : 'text-ok-600');
      setTimeout(() => { el.textContent = ''; }, 3000);
    }

    function statusBadge(status) {
      const isActive = status === 'active';
      const cls = isActive
        ? 'bg-ok-100 text-ok-600 border-ok-600/30'
        : 'bg-paper-100 text-ink-700 border-line';
      return `<span class="inline-block text-xs font-medium px-2 py-0.5 rounded border ${cls}">${esc(status)}</span>`;
    }

    async function loadLinemen() {
      const body = document.getElementById('linemenBody');
      const { data, error } = await _supabase
        .from('linemen')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        body.innerHTML = `<tr><td colspan="5" class="px-5 py-6 text-center text-danger-600">Error: ${esc(error.message)}</td></tr>`;
        return;
      }
      if (!data.length) {
        body.innerHTML = `<tr><td colspan="5" class="px-5 py-6 text-center text-ink-700/60">Wala pang lineman na naka-add.</td></tr>`;
        return;
      }

      body.innerHTML = data.map(l => `
        <tr class="hover:bg-paper-100/60">
          <td class="px-5 py-3 font-medium text-ink-800">${esc(l.name)}</td>
          <td class="px-3 py-3 text-ink-700 num">${esc(l.contact_number || '—')}</td>
          <td class="px-3 py-3 text-ink-700">${esc(l.team || '—')}</td>
          <td class="px-3 py-3">${statusBadge(l.status)}</td>
          <td class="px-5 py-3 space-x-2">
            <button onclick="toggleStatus('${l.id}', '${l.status}')"
              class="text-xs text-ink-700 hover:text-ink-900 underline underline-offset-2">
              ${l.status === 'active' ? 'Set inactive' : 'Set active'}
            </button>
            <button onclick="deleteLineman('${l.id}')"
              class="text-xs text-danger-600 hover:text-danger-600/80 underline underline-offset-2">
              Delete
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function addLineman() {
      const name = document.getElementById('fName').value.trim();
      const contact = document.getElementById('fContact').value.trim();
      const team = document.getElementById('fTeam').value.trim();

      if (!name) { showStatus('Kailangan ng pangalan.', true); return; }

      const { error } = await _supabase
        .from('linemen')
        .insert([{ name, contact_number: contact, team, status: 'active' }]);

      if (error) { showStatus('Error: ' + error.message, true); return; }

      document.getElementById('fName').value = '';
      document.getElementById('fContact').value = '';
      document.getElementById('fTeam').value = '';
      showStatus('Na-add si ' + name + '.');
      loadLinemen();
    }

    async function toggleStatus(id, currentStatus) {
      const newStatus = currentStatus === 'active' ? 'inactive' : 'active';
      const { error } = await _supabase.from('linemen').update({ status: newStatus }).eq('id', id);
      if (error) { showStatus('Error: ' + error.message, true); return; }
      loadLinemen();
    }

    async function deleteLineman(id) {
      if (!confirm('Sigurado ka bang tatanggalin ito sa listahan?')) return;
      const { error } = await _supabase.from('linemen').delete().eq('id', id);
      if (error) { showStatus('Error: ' + error.message, true); return; }
      loadLinemen();
    }

    loadLinemen();
  </script>
</body>
</html>
