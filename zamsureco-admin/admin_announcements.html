<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAMSURECO II — Announcements</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: { 900:'#081D45', 800:'#0D2E63', 700:'#153a7a' },
          amber: { DEFAULT:'#F2A93B', deep:'#C97C1B' },
        },
        fontFamily: {
          display: ['Space Grotesk','sans-serif'],
          body: ['Inter','sans-serif'],
          mono: ['IBM Plex Mono','monospace'],
        }
      }
    }
  }
</script>
<style>
  body{font-family:'Inter',sans-serif;}
  .pulse-dot{animation:pulse 2s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(16,185,129,0.55);}
    70%{box-shadow:0 0 0 6px rgba(16,185,129,0);}
    100%{box-shadow:0 0 0 0 rgba(16,185,129,0);}
  }
  .ticket-id{font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body class="bg-slate-50 text-slate-800 font-body overflow-x-hidden">

  <!-- Dito i-i-inject ng sidebar.js ang shared sidebar at hamburger menu -->
  <div id="sidebar-root"></div>

  <!-- Main Content Wrapper -->
  <div class="main-content flex-1 flex flex-col h-screen overflow-hidden">
    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm flex-shrink-0">
      <div class="flex items-center space-x-4">
        <!-- Hamburger Button -->
        <button class="hamburger-btn bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 rounded-xl w-10 h-10 flex flex-col items-center justify-center gap-1 cursor-pointer transition shadow-sm flex-shrink-0" id="sidebarToggle" aria-label="Toggle navigation menu">
          <span class="block w-4 h-0.5 bg-slate-700 rounded-full"></span>
          <span class="block w-4 h-0.5 bg-slate-700 rounded-full"></span>
          <span class="block w-4 h-0.5 bg-slate-700 rounded-full"></span>
        </button>
        <div>
          <h1 class="text-lg font-display font-bold text-navy-900 leading-tight">Member Announcements</h1>
          <p class="text-xs text-slate-500">Post and manage public advisories for cooperative members</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <span class="h-2.5 w-2.5 rounded-full bg-emerald-500 pulse-dot"></span>
        <span class="text-xs bg-slate-100 text-slate-700 px-3 py-1.5 rounded-full font-medium border border-slate-200 ticket-id">Ipil Grid Connected</span>
      </div>
    </nav>

    <!-- Main Scrollable Area -->
    <main class="flex-1 overflow-y-auto p-8 bg-slate-50">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <div class="mb-6">
          <h3 class="text-base font-display font-bold text-navy-900">Post New Announcement</h3>
          <p class="text-xs text-slate-500 mt-0.5">This will appear immediately on the member-facing app.</p>
        </div>

        <form id="announcementForm" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Title</label>
            <input type="text" id="title" placeholder="e.g. Scheduled Power Interruption" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-navy-800 transition">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Category</label>
            <input type="text" id="category" value="DISTRIBUTION LINE UPDATE" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-navy-800 transition">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Content</label>
            <textarea id="content" rows="3" placeholder="Details for cooperative members..." required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-navy-800 transition"></textarea>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Attachment Image (Optional)</label>
            <input type="file" id="imageFile" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-navy-50 file:text-navy-800 hover:file:bg-navy-150 cursor-pointer border border-slate-300 rounded-xl bg-slate-50">
          </div>
          <div>
            <button type="submit" id="submitBtn" class="bg-navy-800 hover:bg-navy-700 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-sm transition">Publish Announcement</button>
          </div>
        </form>
        <p id="msg" class="mt-3 font-semibold text-xs"></p>

        <hr class="my-8 border-slate-200">

        <div class="mb-4">
          <h3 class="text-base font-display font-bold text-navy-900">Existing Announcements</h3>
          <p class="text-xs text-slate-500 mt-0.5">Most recent first</p>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-100/70 text-slate-600 text-xs uppercase tracking-wider font-semibold border-b border-slate-200">
                <th class="p-4">Image</th>
                <th class="p-4">Title</th>
                <th class="p-4">Category</th>
                <th class="p-4">Content</th>
                <th class="p-4">Date Posted</th>
              </tr>
            </thead>
            <tbody id="announcementTableBody" class="divide-y divide-slate-100 text-sm">
              <tr><td colspan="5" class="p-8 text-center text-slate-400 font-medium">Loading announcements...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    const SUPABASE_URL = 'https://zrnvivattocqvxlxzsld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PUfegf_zyb5B_gVas_SLyw_mto9NFGF';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkAuth() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) { window.location.href = 'admin_login.html'; return; }
      fetchAnnouncements();
    }

    document.addEventListener('click', async (e) => {
      if (e.target.closest('#logoutBtn')) {
        await _supabase.auth.signOut();
        window.location.href = 'admin_login.html';
      }
    });

    checkAuth();

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    async function fetchAnnouncements() {
      const tbody = document.getElementById('announcementTableBody');
      const { data, error } = await _supabase.from('announcements').select('*').order('created_at', { ascending: false });
      if (error) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-rose-500 font-medium">Error: ${escapeHtml(error.message)}</td></tr>`;
        return;
      }
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-400 font-medium">No announcements found.</td></tr>`;
        return;
      }
      tbody.innerHTML = '';
      data.forEach(item => {
        const imageHtml = item.image_url 
          ? `<img src="${escapeHtml(item.image_url)}" alt="Announcement Image" class="w-12 h-12 object-cover rounded-lg border border-slate-200">`
          : `<span class="text-xs text-slate-400 italic">No image</span>`;

        tbody.innerHTML += `<tr class="hover:bg-slate-50/80 transition">
          <td class="p-4">${imageHtml}</td>
          <td class="p-4 font-semibold text-slate-900">${escapeHtml(item.title)}</td>
          <td class="p-4"><span class="px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-800 border border-blue-200 inline-block">${escapeHtml(item.category)}</span></td>
          <td class="p-4 text-slate-600">${escapeHtml(item.content)}</td>
          <td class="p-4 text-xs text-slate-500 ticket-id">${new Date(item.created_at).toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' })}</td>
        </tr>`;
      });
    }

    document.getElementById('announcementForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const content = document.getElementById('content').value;
      const imageFileInput = document.getElementById('imageFile');
      const submitBtn = document.getElementById('submitBtn');
      const msg = document.getElementById('msg');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Publishing...';

      let imageUrl = null;

      // 1. Kung may piniling file, i-upload muna sa Supabase Storage
      if (imageFileInput.files && imageFileInput.files[0]) {
        const file = imageFileInput.files[0];
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36.substring(2, 9))}.${fileExt}`;
        const filePath = `${fileName}`;

        // Siguraduhing 'announcements-images' ang pangalan ng bucket mo sa Supabase
        const { data: uploadData, error: uploadError } = await _supabase.storage
          .from('announcements-images')
          .upload(filePath, file);

        if (uploadError) {
          msg.className = 'mt-3 font-semibold text-xs text-rose-600';
          msg.textContent = 'Image Upload Error: ' + uploadError.message;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Publish Announcement';
          return;
        }

        // Kunin ang Public URL ng in-upload na litrato
        const { data: publicUrlData } = _supabase.storage
          .from('announcements-images')
          .getPublicUrl(filePath);

        imageUrl = publicUrlData.publicUrl;
      }

      // 2. I-save ang data kasama ang image_url sa announcements table
      // *Tandaan: Kailangan mong may column na 'image_url' (text) sa iyong Supabase table.*
      const { error } = await _supabase.from('announcements').insert([{ 
        title, 
        category, 
        content, 
        image_url: imageUrl 
      }]);

      if (error) {
        msg.className = 'mt-3 font-semibold text-xs text-rose-600';
        msg.textContent = 'Error: ' + error.message;
      } else {
        msg.className = 'mt-3 font-semibold text-xs text-emerald-600';
        msg.textContent = 'Announcement published successfully with image!';
        document.getElementById('announcementForm').reset();
        fetchAnnouncements();
        setTimeout(() => { msg.textContent = ''; }, 3000);
      }

      submitBtn.disabled = false;
      submitBtn.textContent = 'Publish Announcement';
    });
  </script>

  <!-- Tawagin ang sidebar.js para gumana ang shared drawer navigation -->
  <script src="sidebar.js"></script>
</body>
</html>
