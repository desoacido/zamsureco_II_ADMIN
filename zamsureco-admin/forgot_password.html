<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAMSURECO II — Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#081D45;
    --navy-800:#0D2E63;
    --navy-700:#153a7a;
    --amber:#F2A93B;
    --amber-deep:#C97C1B;
    --red:#DC3545;
    --red-bg:#FCE8EA;
    --green:#3F7857;
    --green-bg:#E7F3EC;
    --border:#E2E6ED;
    --text:#16233F;
    --text-faint:#9AA3B5;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif; color:var(--text);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 20% 20%, #0f3a86 0%, var(--navy-900) 55%, #050f28 100%);
    position:relative; overflow:hidden;
  }
  body::before{
    content:""; position:absolute; inset:0;
    background-image:repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 38px);
    pointer-events:none;
  }
  .card{
    position:relative; z-index:1;
    background:#fff; width:380px; max-width:90vw;
    border-radius:16px; padding:34px 32px 30px;
    box-shadow:0 24px 60px rgba(5,15,40,0.45);
  }
  .brand{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:22px;}
  .brand .brand-mark{width:44px; height:44px;}
  .brand .title{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; color:var(--navy-900);}
  .brand .sub{font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--amber-deep); font-weight:700; margin-top:1px;}
  .intro{font-size:13px; color:var(--text-faint); text-align:center; line-height:1.5; margin-bottom:6px;}
  label{font-size:12px; font-weight:600; color:var(--navy-800); text-transform:uppercase; letter-spacing:0.5px; display:block; margin:14px 0 6px;}
  input{
    width:100%; padding:11px 13px; border:1px solid var(--border); border-radius:8px;
    font-size:14px; font-family:'Inter',sans-serif; color:var(--text); background:#FBFCFE;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input:focus{outline:none; border-color:var(--navy-700); box-shadow:0 0 0 3px rgba(21,58,122,0.12); background:#fff;}
  button#resetBtn{
    width:100%; margin-top:18px; padding:12px; font-size:14px;
    background:var(--navy-800); color:#fff; border:none; border-radius:8px;
    cursor:pointer; font-weight:600; font-family:'Inter',sans-serif;
    transition:background .15s ease, transform .1s ease;
  }
  button#resetBtn:hover{background:var(--navy-700);}
  button#resetBtn:active{transform:scale(0.98);}
  button#resetBtn:disabled{opacity:0.6; cursor:default;}
  .msg{
    margin-top:14px; padding:10px 12px; border-radius:8px; font-size:12.5px; font-weight:500; display:none;
  }
  .msg.error{background:var(--red-bg); color:var(--red); border:1px solid #f5c2c7;}
  .msg.success{background:var(--green-bg); color:var(--green); border:1px solid #bfe0cc;}
  .back-link{display:block; text-align:center; margin-top:18px; font-size:12px; color:var(--navy-700); text-decoration:none;}
  .back-link:hover{text-decoration:underline;}
</style>
</head>
<body>

  <div class="card">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="19" stroke="#F2A93B" stroke-width="1.4" opacity="0.5"/>
        <path d="M22 4 L10 22 H18 L16 36 L30 16 H21 L22 4Z" fill="#F2A93B"/>
      </svg>
      <div class="title">ZAMSURECO II</div>
      <div class="sub">Reset Password</div>
    </div>

    <p class="intro">Enter your admin email address and we will send you a link to reset your password.</p>

    <form id="resetForm">
      <label for="resetEmail">Email</label>
      <input type="email" id="resetEmail" placeholder="admin@zamsureco.com" required autocomplete="username">

      <button type="submit" id="resetBtn">Send Reset Link</button>
    </form>

    <p id="resetMsg" class="msg error"></p>

    <a href="admin_login.html" class="back-link">&larr; Back to Sign In</a>
  </div>

  <script>
    const SUPABASE_URL = 'https://zrnvivattocqvxlxzsld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PUfegf_zyb5B_gVas_SLyw_mto9NFGF';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const RESET_PAGE = 'https://zamsureco-ii-admin-1.onrender.com/update_password.html';

    const resetForm = document.getElementById('resetForm');
    const resetBtn = document.getElementById('resetBtn');
    const resetMsg = document.getElementById('resetMsg');

    function showMsg(text, type) {
      resetMsg.textContent = text;
      resetMsg.className = 'msg ' + type;
      resetMsg.style.display = 'block';
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();

      resetBtn.disabled = true;
      resetBtn.textContent = 'Sending...';
      resetMsg.style.display = 'none';

      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: RESET_PAGE });

      resetBtn.disabled = false;
      resetBtn.textContent = 'Send Reset Link';

      if (error) {
        showMsg('Error: ' + error.message, 'error');
      } else {
        showMsg('If this email is registered, a reset link has been sent. Please check your inbox.', 'success');
      }
    });
  </script>
</body>
</html>
