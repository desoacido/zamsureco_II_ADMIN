<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - ZAMCO II Admin</title>
  <!-- Tailwind CSS para mabilis at malinis ang itsura -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Reset Password</h2>
    <p class="text-sm text-gray-600 mb-4 text-center">Enter your admin email address and we'll send you a link to reset your password.</p>
    
    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="resetEmail">Email Address</label>
      <input type="email" id="resetEmail" placeholder="admin@zamsureco.com" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
    </div>

    <button id="resetBtn" onclick="handleForgotPassword()" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
      Send Reset Link
    </button>

    <p id="resetMessage" class="text-sm text-center mt-4"></p>

    <div class="text-center mt-6">
      <a href="admin_login.html" class="text-sm text-blue-600 hover:underline">Back to Login</a>
    </div>
  </div>

  <script>
    // Palitan nito ang iyong mga totoong Supabase credentials kung kinakailangan o kung wala pa sa hiwalay na config file
    const SUPABASE_URL = 'https://zrnvivattocqvxlxzsld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PUfegf_zyb5B_gVas_SLyw_mto9NFGF';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function handleForgotPassword() {
      const email = document.getElementById('resetEmail').value.trim();
      const messageEl = document.getElementById('resetMessage');
      const btn = document.getElementById('resetBtn');

      if (!email) {
        messageEl.style.color = 'red';
        messageEl.textContent = 'Please enter an email address.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';
      messageEl.textContent = '';

      try {
        const { data, error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: 'https://zamsureco-ii-admin-1.onrender.com/update_password.html', 
        });

        if (error) throw error;

        messageEl.style.color = 'green';
        messageEl.textContent = 'Password reset link sent to your email. Please check your inbox.';
      } catch (error) {
        messageEl.style.color = 'red';
        messageEl.textContent = 'Error: ' + error.message;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    }
  </script>

</body>
</html>
